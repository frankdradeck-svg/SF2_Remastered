hardware:
 platform: fast
 stepper_controllers: pololu_tic

fast:
  net:
    controller: neuron
    io_loop:
      front:
        model: FP-I/O-3208
        order: 1
      back:
        model: FP-I/O-1616
        order: 2
    watchdog: 1s
  exp:
    boards:
      playfield:
        model: FP-EXP-0071-2
        led_fade_time: 100ms

custom_code:
  - custom_code.chunli.Chunli

steppers:
  chun_stepper:
    number: "00506424"
    homing_mode: switch
    homing_direction: clockwise
    homing_switch: s_stepper_home
    pos_min: 0
    pos_max: 1000000
    named_positions:
      10: stepper_up
      20: stepper_down
      999999: stepper_go
    relative_positions:
      50: stepper_forward_50
      -50: stepper_back_50
      0: stepper_stop
    platform_settings:
      max_acceleration: 40000
      current_limit: 931
      max_deceleration: 40000
      max_speed: 2000000
      poll_ms: 100ms
      starting_speed: 0
      step_mode: 1

