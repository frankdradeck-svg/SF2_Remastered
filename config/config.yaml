event_player:
  trigger_slow_speed:   
    set_tic_velocity: 
      velocity: 100000    # Speed 1: Slow (10 microsteps/sec)
  trigger_medium_speed: 
    set_tic_velocity: 
      velocity: 300000    # Speed 2: Medium (30 microsteps/sec)
  trigger_fast_speed:   
    set_tic_velocity: 
      velocity: 600000    # Speed 3: Fast (60 microsteps/sec)
  trigger_motor_stop:   
    set_tic_velocity: 
      velocity: 0         # Stop Command

diverters:
  left_ramp:
    activation_coil: c_left_ramp_divert
    type: hold
    activate_events: fight_qualified_event, ball_started{current_player.fight_qualified==1}, logicblock_chunli_hits_hit{remaining==1}, logicblock_vega_hits_hit{remaining==1}, mode_field_started{current_player.fight_qualified==1}, logicblock_blanka_hits_hit{remaining==1}, logicblock_zangief_hits_hit{remaining==1}, logicblock_sagat_hits_hit{remaining==1}, logicblock_dhalsim_hits_hit{remaining==1}, logicblock_balrog_hits_hit{remaining==1}, logicblock_ehonda_hits_hit{remaining==1}
    enable_events: ball_started, multiball_guile_mb_ended
    deactivate_events: vega_started{device.counters.vega_hits.value<2}, chunli_started{device.counters.chunli_hits.value<2}, mode_field_started{current_player.fight_qualified!=1}, ball_ended, game_ending, ehonda_started{device.counters.ehonda_hits.value<2}, blanka_started{device.counters.blanka_hits.value<2}, dhalsim_started{device.counters.dhalsim_hits.value<2}, sagat_started{device.counters.sagat_hits.value<2}, balrog_started{device.counters.balrog_hits.value<2}, zangief_started{device.counters.zangief_hits.value<2}
    disable_events: ball_ended, game_ending, guile_mb_started
    targets_when_active: playfield
    targets_when_inactive: playfield

  right_ramp:
    activation_coil: c_right_ramp_divert
    type: hold
    activate_events: car_mb_qualified_event, ball_started{current_player.car_mb_qualified==1}, mode_field_started{current_player.car_mb_qualified==1}
    deactivate_events: vega_started, chunli_started, mode_field_started{current_player.car_mb_qualified!=1}, ball_ended, game_ending, zangief_started, blanka_started, dhalsim_started, sagat_started, balrog_started, ehonda_started
    targets_when_active: playfield
    targets_when_inactive: playfield
    disable_events: ball_ended, game_ending, guile_mb_started
    enable_events: ball_started, multiball_guile_mb_ended


playfields:
  playfield:
    default_source_device: bd_plunger_lane
    tags: default

autofire_coils:
  left_slingshot:
    coil: c_left_sling
    switch: s_left_sling
  right_slingshot:
    coil: c_right_sling
    switch: s_right_sling
  pop_bumper:
    coil: c_pop_bumper
    switch: s_pop_bumper

ball_devices:
  bd_drain:
    ball_switches: s_drain
    eject_coil: c_drain_eject
    eject_targets: bd_trough
    tags: drain
    eject_timeouts: 4s
  bd_trough:
    entrance_switch: s_trough
    entrance_switch_full_timeout: 1000ms
    ball_capacity: 3
    eject_coil: c_trough_eject
    eject_coil_enable_time: 500ms
    tags: trough, home
    eject_timeouts: 3s
    eject_targets: bd_plunger_lane
  bd_plunger_lane:
    ball_switches: s_shooter
    mechanical_eject: true
    eject_timeouts: 3s
    eject_coil: c_autolauncher
  bd_left_vuk:
    ball_switches: s_left_vuk
    eject_coil: c_left_vuk
    eject_timeouts: 1s
  bd_right_vuk:
    ball_switches: s_right_vuk
    eject_coil: c_right_vuk
    eject_timeouts: 1s
  
