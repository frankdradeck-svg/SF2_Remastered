      expire: 3s 
      priority: 103
  fight_qualified_event:
    challenger_overlay:
      action: play
  guile_mb_qualified_event:
    guile_mb_overlay:
      action: play
  car_mb_qualified_event:
    bonus_mb_overlay:
      action: play
  ball_started{current_player.car_mb_qualified==1}:
    bonus_mb_overlay:
      action: play
  ball_started{current_player.fight_qualified==1}:
    challenger_overlay:
      action: play
  ball_started{current_player.guile_mb_qualified==1}:
    guile_mb_overlay:
      action: play
  mode_field_started{current_player.car_mb_qualified==1}:
    bonus_mb_overlay:
      action: play
  mode_field_started{current_player.fight_qualified==1}:
    challenger_overlay:
      action: play
  mode_field_started{current_player.guile_mb_qualified==1}:
    guile_mb_overlay:
      action: play
  s_right_vuk_active{current_player.ken_hurry_active!=1}:
