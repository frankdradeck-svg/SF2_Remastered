      expire: 3s
      priority: 101


variable_player:
  timer_field_stepper_intro_started:
    stepper_intro_running:
      action: set
      int: 1
  timer_field_stepper_intro_stopped:
    stepper_intro_running:
      action: set
      int: 0
  s_left_inlane_active:
    score: 10000
  s_guile_opto_active:
    score: 150000
  s_center_spinner_active:
    score: 5000
  s_right_vuk_active:
    score: 10000
  s_left_vuk_active:
    score: 10000
  s_zangief_active:
    score: 120000
  s_chunli_entrance_active:
    score: 120000
  s_loop_spinner_active:
    score: 10000
  s_right_standup_1_active:
    score: 10000
  s_right_standup_2_active:
    score: 10000
  left_orbit_count_complete_event:
    score: 100000
  mode_ken_hurry_stopped:
    ken_hurry_active:
      int: 0
      action: set
  torpedo_complete:
    torpedo_qualified:
      int: 1
      action: set
  timer_torpedo_timer_started:
    torpedo_running:
      int: 1
      action: set
  timer_torpedo_outro_timer_stopped:
