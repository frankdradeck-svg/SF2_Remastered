light_player:
  ball_started{current_player.fight_qualified==1}:
    led_dhalsim_flame: off
  fight_qualified_event:
    led_dhalsim_flame: off
  ball_started{current_player.guile_mb_qualified==0}:
    led_guile_advance:
      color: orange
  mode_field_started{current_player.guile_mb_qualified==0}:
    led_guile_advance:
      color: orange
  ball_started{current_player.car_mb_qualified!=1}:
    led_blanka_car: 
      color: orange
  mode_field_started{current_player.car_mb_qualified!=1}:
    led_blanka_car: 
      color: orange

show_player:
  s_left_vuk_active:
    left_vuk_alert:
      speed: 12
      loops: 5
  s_right_vuk_active:
    right_vuk_alert:
      speed: 12
      loops: 5
  ball_started{current_player.blanka_frenzy_qualified==1 or current_player.cammy_combos_qualified==1}:
    chase_balrog:
      speed: 2
      loops: -1
  mode_field_started{current_player.blanka_frenzy_qualified==1 or current_player.cammy_combos_qualified==1}:
    chase_balrog:
      speed: 2
      loops: -1
  s_right_vuk_active{current_player.blanka_frenzy_qualified==1 or current_player.cammy_combos_qualified==1}:
    chase_balrog:
      action: stop
  cammy_combos_start:
    chase_balrog:
      speed: 2
      loops: -1
  blanka_frenzy_start:
    chase_balrog:
      speed: 2
      loops: -1
  ball_started{current_player.fight_qualified!=1 and current_player.fighter_mode_qualified!=1}:
    flash_color:
      key: dhalsim_flash
      speed: 2
      show_tokens:
        lights: led_dhalsim_flame
        color: red
  mode_field_started{current_player.fight_qualified!=1 and current_player.fighter_mode_qualified!=1}:
    flash_color:
      key: dhalsim_flash
      speed: 2
      show_tokens:
        lights: led_dhalsim_flame
        color: red
  ball_started{current_player.guile_mb_qualified==1}:
    flash_color:
      key: guile_flash
      speed: 4
      show_tokens:
        lights: led_guile_advance
        color: orange
  mode_field_started{current_player.guile_mb_qualified==1}:
    flash_color:
      key: guile_flash
      speed: 4
      show_tokens:
        lights: led_guile_advance
        color: orange
  guile_mb_qualified_event:
    flash_color:
      key: guile_flash
      speed: 4
      show_tokens:
        lights: led_guile_advance
        color: orange
  fight_qualified_event:
    chase_zangief:
      speed: 2
      loops: -1
  get_fighter_letter{current_player.fighter_letters==6 or current_player.fighter_letters==13 or current_player.fighter_letters==20}:
    chase_zangief:
      speed: 2
      loops: -1
  ball_started{current_player.fight_qualified==1 or current_player.fighter_mode_qualified==1}:
    chase_zangief:
      speed: 2
      loops: -1
  mode_field_started{current_player.fight_qualified==1 or current_player.fighter_mode_qualified==1}:
    chase_zangief:
      speed: 2
      loops: -1
  car_mb_qualified_event:
    flash_color:
      key: chunli_flash
      speed: 4
      show_tokens:
        lights: led_vega_defeat, led_chunli_defeat, led_chunli_double, led_chunli_power
        color: white
  mode_field_started{current_player.car_mb_qualified==1}:
    flash_color:
      key: chunli_flash
      speed: 4
      show_tokens:
        lights: led_vega_defeat, led_chunli_defeat, led_chunli_double, led_chunli_power
        color: white
  ball_started{current_player.car_mb_qualified==1}:
    flash_color:
      key: chunli_flash
      speed: 4
      show_tokens:
        lights: led_vega_defeat, led_chunli_defeat, led_chunli_double, led_chunli_power
        color: white


event_player:
  s_left_ramp_rollover_active{current_player.fight_qualified==1 and current_player.fighter_mode_qualified!=1}: choose_fight
  s_left_ramp_rollover_active{current_player.fighter_mode_qualified==1}: choose_fighter_mode
  s_guile_opto_active{current_player.guile_mb_qualified==1}: guile_mb_started
  s_right_orbit_rollover_active{current_player.car_mb_qualified==1}: car_mb_started
  timer_field_stepper_intro_started: chunli_intro_start
  s_stepper_home_active: chunli_home
  s_chunli_entrance_active: chunli_move_90
  s_right_vuk_active{current_player.blanka_frenzy_qualified==1}: blanka_frenzy_started
  s_right_vuk_active{current_player.cammy_combos_qualified==1}: cammy_combos_started
  
counters:
  loop_spinner_hits:
    count_events: s_loop_spinner_active
    starting_count: 0
    count_complete_value: 60
    direction: up
    persist_state: true
    disable_on_complete: true
  left_orbit_hits:
    count_events: s_left_orbit_rollover_active
    starting_count: 0
    count_complete_value: 2
    direction: up
    events_when_complete: left_orbit_count_complete_event
    persist_state: false
    disable_on_complete: false
    reset_on_complete: true
  torpedo_hits:
    count_events: s_left_vuk_active
    starting_count: 0
    count_complete_value: 7
    direction: up
    events_when_complete: torpedo_complete
    persist_state: true
    reset_on_complete: false
    disable_on_complete: true
  loop_counter:
    count_events: loop_hit
    starting_count: 0
    direction: up
    restart_events: timer_loops_timer_stopped
  combos_hits:
    count_events: combo_1_hit, combo_2_hit, combo_3_hit
    starting_count: 0
    count_complete_value: 5
    direction: up
    events_when_complete: cammy_combos_start
    persist_state: true
    reset_on_complete: false
    disable_on_complete: true
  blanka_count:
    count_events: s_center_spinner_active, s_loop_spinner_active, s_pop_bumper_active, s_pop_standup_1_active, s_pop_standup_2_active, s_pop_standup_3_active
    starting_count: 0
    count_complete_value: 200
    direction: up
    events_when_complete: blanka_frenzy_start
    persist_state: true
    reset_on_complete: false
    disable_on_complete: true

timers:
  field_intro_timer:
    start_value: 5
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: true
  field_stepper_intro:
    start_value: 3
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: mode_field_started
        action: start
      - event: timer_field_stepper_intro_complete
        action: reset
  loops_timer:
    start_value: 3
    max_value: 3
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: loop_hit
        action: start
      - event: logicblock_loop_counter_hit
        action: add
        value: 3
