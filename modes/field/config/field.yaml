    torped_o:
      expire: 3s
      priority: 102
  s_left_vuk_active{current_player.torpedo_running!=1 and device.counters.torpedo_hits.value>5}:
    ehonda_videos:
      expire: 3s
      priority: 101
  s_loop_spinner_active{device.counters.car_loop_spinner_hits.value==19}:
    car_mb_progress:
      expire: 3s
      priority: 102
    c_ar:
      expire: 3s
      priority: 103
  s_loop_spinner_active{device.counters.car_loop_spinner_hits.value==39}:
    car_mb_progress:
      expire: 3s
