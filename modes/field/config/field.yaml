  logicblock_blanka_count_hit:
    blanka_spins: 1
  timer_loops_timer_stopped:
    loop_count:
      action: set
      int: 0
  logicblock_loop_counter_hit:
    loop_count: 1
  timer_field_stepper_intro_started:
    stepper_intro_running:
      action: set
      int: 1
  timer_field_stepper_intro_stopped:
    stepper_intro_running:
      action: set
      int: 0
  s_left_inlane_active:
