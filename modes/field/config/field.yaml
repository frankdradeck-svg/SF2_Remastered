      int: 0
      action: set

light_player:
  ball_started{current_player.fight_qualified==1}:
    led_dhalsim_flame: off
  fight_qualified_event:
    led_dhalsim_flame: off
  ball_started{current_player.guile_mb_qualified==0}:
    led_guile_advance:
      color: orange
  mode_field_started{current_player.guile_mb_qualified==0}:
    led_guile_advance:
      color: orange
  ball_started{current_player.car_mb_qualified!=1}:
    led_blanka_car: 
      color: orange
  mode_field_started{current_player.car_mb_qualified!=1}:
    led_blanka_car: 
      color: orange

show_player:
  ball_started{current_player.fight_qualified!=1}:
    flash_color:
      key: dhalsim_flash
      speed: 2
      show_tokens:
        lights: led_dhalsim_flame
        color: red
  mode_field_started{current_player.fight_qualified!=1}:
    flash_color:
      key: dhalsim_flash
      speed: 2
      show_tokens:
        lights: led_dhalsim_flame
        color: red
  ball_started{current_player.guile_mb_qualified==1}:
    flash_color:
      key: guile_flash
      speed: 4
      show_tokens:
        lights: led_guile_advance
        color: orange
  mode_field_started{current_player.guile_mb_qualified==1}:
    flash_color:
      key: guile_flash
      speed: 4
      show_tokens:
        lights: led_guile_advance
        color: orange
  guile_mb_qualified_event:
    flash_color:
      key: guile_flash
      speed: 4
      show_tokens:
        lights: led_guile_advance
        color: orange
  fight_qualified_event:
    flash_color:
      key: zangief_flash
      speed: 4
      show_tokens:
        lights: led_sagat_defeat, led_zangief_defeat, led_zangief_double, led_zangief_power
        color: white
  ball_started{current_player.fight_qualified==1}:
    flash_color:
      key: zangief_flash
      speed: 4
      show_tokens:
        lights: led_sagat_defeat, led_zangief_defeat, led_zangief_double, led_zangief_power
        color: white
  mode_field_started{current_player.fight_qualified==1}:
    flash_color:
      key: zangief_flash
      speed: 4
      show_tokens:
        lights: led_sagat_defeat, led_zangief_defeat, led_zangief_double, led_zangief_power
        color: white
  car_mb_qualified_event:
    flash_color:
      key: chunli_flash
      speed: 4
      show_tokens:
        lights: led_vega_defeat, led_chunli_defeat, led_chunli_double, led_chunli_power
        color: white
  mode_field_started{current_player.car_mb_qualified==1}:
    flash_color:
      key: chunli_flash
      speed: 4
      show_tokens:
        lights: led_vega_defeat, led_chunli_defeat, led_chunli_double, led_chunli_power
        color: white
  ball_started{current_player.car_mb_qualified==1}:
    flash_color:
      key: chunli_flash
      speed: 4
      show_tokens:
        lights: led_vega_defeat, led_chunli_defeat, led_chunli_double, led_chunli_power
        color: white


event_player:
  s_left_ramp_rollover_active{current_player.fight_qualified==1}: choose_fight
  s_guile_opto_active{current_player.guile_mb_qualified==1}: guile_mb_started
  s_right_orbit_rollover_active{current_player.car_mb_qualified==1}: car_mb_started
  timer_field_stepper_intro_started: chunli_intro_start
  s_stepper_home_active: chunli_home
  s_chunli_entrance_active: chunli_move_90
  
counters:
  loop_spinner_hits:
    count_events: s_loop_spinner_active
    starting_count: 0
    count_complete_value: 60
    direction: up
    persist_state: true
    disable_on_complete: true
  left_orbit_hits:
    count_events: s_left_orbit_rollover_active
    starting_count: 0
    count_complete_value: 2
    direction: up
    events_when_complete: left_orbit_count_complete_event
    persist_state: false
    disable_on_complete: false
    reset_on_complete: true
  torpedo_hits:
    count_events: s_left_vuk_active
    starting_count: 0
    count_complete_value: 7
    direction: up
    events_when_complete: torpedo_complete
    persist_state: true
    reset_on_complete: false
    disable_on_complete: true

timers:
  field_intro_timer:
    start_value: 5
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: true
  field_stepper_intro:
    start_value: 3
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: mode_field_started
        action: start
      - event: timer_field_stepper_intro_complete
        action: reset
