      expire: 3s
      priority: 101
    torped_o:
      expire: 3s
      priority: 102
  s_left_vuk_active{current_player.torpedo_running!=1 and device.counters.torpedo_hits.value>5}:
    ehonda_videos:
      expire: 3s
      priority: 101
  s_loop_spinner_active{device.counters.car_loop_spinner_hits.value==19}:
    car_mb_progress:
      expire: 3s
      priority: 102
    c_ar:
      expire: 3s
      priority: 103
  s_loop_spinner_active{device.counters.car_loop_spinner_hits.value==39}:
    car_mb_progress:
      expire: 3s
      priority: 102
    ca_r:
      expire: 3s 
      priority: 103
  s_loop_spinner_active{device.counters.car_loop_spinner_hits.value==59}:
    car_mb_progress:
      expire: 3s
      priority: 102
    car_complete:
      expire: 3s 
      priority: 103
  fight_qualified_event:
    challenger_overlay:
      action: play
  guile_mb_qualified_event:
    guile_mb_overlay:
      action: play
  car_mb_qualified_event:
    bonus_mb_overlay:
      action: play
  ball_started{current_player.car_mb_qualified==1}:
    bonus_mb_overlay:
      action: play
  ball_started{current_player.fight_qualified==1}:
    challenger_overlay:
      action: play
  ball_started{current_player.guile_mb_qualified==1}:
    guile_mb_overlay:
      action: play
  mode_field_started{current_player.car_mb_qualified==1}:
    bonus_mb_overlay:
      action: play
  mode_field_started{current_player.fight_qualified==1}:
    challenger_overlay:
      action: play
  mode_field_started{current_player.guile_mb_qualified==1}:
    guile_mb_overlay:
      action: play
  s_right_vuk_active{current_player.ken_hurry_active!=1}:
    bison_videos:
      expire: 3s
