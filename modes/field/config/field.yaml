#config_version=6

mode:
  start_events: multiball_akuma_mb_ended, ball_starting, timer_finishing_vega_timer_complete, timer_finishing_chunli_timer_complete, multiball_guile_mb_ended, multiball_car_mb_ended, timer_finishing_blanka_timer_complete, timer_finishing_ehonda_timer_complete, timer_finishing_sagat_timer_complete, timer_finishing_dhalsim_timer_complete, timer_finishing_balrog_timer_complete, timer_finishing_zangief_timer_complete
  stop_events: ball_will_end, cammy_combos_started, choose_fighter_mode, chunli_started, vega_started, guile_mb_started, car_mb_started, blanka_started, zangief_started, dhalsim_started, balrog_started, sagat_started, ehonda_started
  priority: 300

sound_player:
  fight_qualified_event:
    challenger2: 
      bus: voice
  get_fighter_letter{current_player.fighter_letters==6 or current_player.fighter_letters==13 or current_player.fighter_letters==20}:
    challenger2: 
      bus: voice
  car_mb_qualified_event:
    shoot_under_right:
      bus: voice_boost
  timer_field_intro_timer_complete{current_player.fight_qualified==1 or current_player.fighter_mode_qualified==1}:
    shoot_under_left:
      bus: voice
  timer_field_intro_timer_complete{current_player.fight_qualified!=1}:
    shoot_flame:
      bus: voice_loud
  chunli_animation_started:
    chun_vfx:
      bus: voice
  loop_hit{device.counters.loop_counter.value==1}:
    wizz:
      bus: effects
      action: replace
  loop_hit{device.counters.loop_counter.value==2}:
    wizz2:
      bus: effects
      action: replace
  loop_hit{device.counters.loop_counter.value==3}:
    wizz3:
      bus: effects
      action: replace
  loop_hit{device.counters.loop_counter.value>3}:
    wizz4:
      bus: effects
      action: replace
      


slide_player:
  logicblock_combos_hits_hit{device.counter.combos_hits.value==0}:
