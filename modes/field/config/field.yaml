#config_version=6

#NEED TORPEDO OVERLAY SLIDES

mode:
  start_events: ball_starting, timer_finishing_vega_timer_complete, timer_finishing_chunli_timer_complete, multiball_guile_mb_ended, multiball_car_mb_ended, timer_finishing_blanka_timer_complete, timer_finishing_ehonda_timer_complete, timer_finishing_sagat_timer_complete, timer_finishing_dhalsim_timer_complete, timer_finishing_balrog_timer_complete, timer_finishing_zangief_timer_complete
  stop_events: ball_will_end, chunli_started, vega_started, guile_mb_started, car_mb_started, blanka_started, zangief_started, dhalsim_started, balrog_started, sagat_started, ehonda_started
  priority: 300

sound_player:
  fight_qualified_event:
    challenger2: 
      bus: voice
  car_mb_qualified_event:
    shoot_under_right:
      bus: voice_boost
  timer_field_intro_timer_complete{current_player.fight_qualified==1}:
    shoot_under_left:
      bus: voice
  timer_field_intro_timer_complete{current_player.fight_qualified!=1}:
    shoot_flame:
      bus: voice_loud

slide_player:
  timer_millions_timer_complete:
    field:
      action: play
  mode_field_started: 
    field:
      action: play
    vega:
      action: remove
    chunli:
      action: remove
    guile_mb:
      action: remove
  s_guile_opto_active:
    guile_videos:
      expire: 3s
      priority: 101
  s_guile_opto_active{device.counters.guile_hits.value==0 and current_player.guile_mb_played!=1}:
    g_uile:
      expire: 3s
      priority: 102
