#config_version=6

mode:
  start_events: ball_starting
  stop_events: ball_will_end
  priority: 100

slide_player:
  mode_base_started: 
    base:
      action: play
      priority: 300
    attract:
      action: remove

ball_saves:
  default:
    active_time: 10s
    hurry_up_time: 2s
    grace_period: 2s
    enable_events: mode_base_started
    timer_start_events: balldevice_bd_plunger_lane_ball_eject_success
    auto_launch: true
    balls_to_save: 1

show_player:
  ball_save_default_timer_start:
    flash_color:
      key: ball_save
      speed: 2
      show_tokens:
        lights: led_shoot_again
        color: red
  ball_save_default_hurry_up:
    flash_color:
      key: ball_save
      speed: 4
      show_tokens:
        lights: led_shoot_again
        color: red
  ball_save_default_disabled:
    ball_save: stop

light_player:
  mode_base_started:
    led_gi:
      color: white
      fade: 200ms
    led_pop_standups_1:
      color: green
    led_pop_standups_2:
      color: green
    led_pop_standups_3:
      color: green
  timer_finishing_vega_timer_complete:
    led_vega_defeat:
      color: white
      fade: 200ms
  timer_finishing_chunli_timer_complete:
    led_chunli_defeat:
      color: white
      fade: 200ms
  timer_finishing_ehonda_timer_complete:
    led_honda_defeat:
      color: white
      fade: 200ms
  timer_finishing_zangief_timer_complete:
    led_zangief_defeat:
      color: white
      fade: 200ms
  timer_finishing_sagat_timer_complete:
    led_sagat_defeat:
      color: white
      fade: 200ms
  timer_finishing_dhalsim_timer_complete:
    led_dhalsim_defeat:
      color: white
      fade: 200ms
  timer_finishing_balrog_timer_complete:
    led_balrog_defeat:
      color: white
      fade: 200ms
  timer_finishing_blanka_timer_complete:
    led_blanka_defeat:
      color: white
      fade: 200ms
  mode_guile_mb_started:
    led_guile_defeat:
      color: white
      fade: 200ms
  mode_millions_started:
    led_ryu_defeat:
      color: white
      fade: 200ms

shots:
  zangief_ramp:
    switch: s_zangief
  left_orbit:
    switch: s_left_orbit_rollover
  left_vuk:
    switch: s_left_vuk
  right_vuk:
    switch: s_right_vuk
  center_spinner:
    switch: s_center_spinner
  guile_ramp:
    switch: s_guile_opto
  chunli_ramp:
    switch: s_chunli_entrance
  loop_spinner:
    switch: s_loop_spinner

variable_player:
  timer_finishing_vega_timer_complete:
    fights_completed: 1
  timer_finishing_chunli_timer_complete:
    fights_completed: 1
  timer_finishing_ehonda_timer_complete:
    fights_completed: 1
  timer_finishing_zangief_timer_complete:
    fights_completed: 1
  timer_finishing_sagat_timer_complete:
    fights_completed: 1
  timer_finishing_dhalsim_timer_complete:
    fights_completed: 1
  timer_finishing_balrog_timer_complete:
    fights_completed: 1
  timer_finishing_blanka_timer_complete:
    fights_completed: 1
  mode_guile_mb_started:
    fights_completed: 1
