        type: fade
        duration: 5s
    vega_ryu_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko_loss:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_1:
      action: play
    health_Right_1hit:
      action: play
      priority: 4
    fight_hit_1:
      action: play
      expire: 3s
      priority: 5
  power_move_event{device.counters.vega_hits.value==1}:
    health_Right_1hit:
      action: remove
      transition:
        type: fade
        duration: 3s
    vega:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko_loss:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_2:
      action: play
    health_Right_2hit:
      action: play
      priority: 3
    fight_hit_2:
      action: play
      expire: 3s
      priority: 5

sound_player:
  mode_vega_started:
    vega_theme:
      bus: music_loud

variable_player:
  finishing_vega:
    vega_completed:
      int: 1
      action: set
    fight_qualified:
      int: 0
      action: set
  vega_scoop_intro_finish_event:
    vega_intro_complete:
      int: 1
      action: set
  power_move_event{device.counters.vega_hits.value==0}:
    score: 2000000
  power_move_event{device.counters.vega_hits.value==1}:
    score: 4000000
  logicblock_vega_hits_hit{remaining == 0}:
    score: 10000000

queue_relay_player:
  balldevice_bd_left_vuk_ball_eject_attempt{device.counters.vega_hits.value==3}:
    post: vega_scoop_ko_finish_event
    wait_for: timer_finishing_vega_timer_complete
  balldevice_bd_left_vuk_ball_eject_attempt{current_player.vega_intro_complete!=1}:
    post: vega_scoop_intro_finish_event
    wait_for: timer_vega_intro_timer_complete

timers:
  vega_intro_timer:
    start_value: 5
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: true
  vega_fight_timer:
    start_value: 15
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - action: start
        event: mode_vega_started
      - action: stop
        event: vega_losing
      - action: add
        event: power_move_event
        value: 15
    restart_on_complete: true
  finishing_vega_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - action: start
        event: finishing_vega
  vega_losing_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - action: start
        event: vega_losing
#timer_finishing_mode_complete

light_player:
  led_zangief_power_solid:
    led_zangief_power:
      color: orange
      priority: 3
  led_chunli_power_solid:
    led_chunli_power:
      color: orange
      priority: 3
  led_balrog_power_solid:
    led_balrog_power:
      color: orange
      priority: 3

show_player:
  mode_vega_started:
    flash_color:
      speed: 2
      show_tokens:
        lights: led_zangief_power, led_chunli_power, led_balrog_power
        color: orange
  logicblock_vega_hits_hit{remaining == 1}:
    flash_color:
      speed: 4
      show_tokens:
        lights: led_sagat_defeat, led_zangief_defeat, led_zangief_double, led_zangief_power
        color: white
      priority: 5
    off:
      show_tokens:
        lights: led_zangief_power, led_chunli_power, led_balrog_power
      priority: 4

counters:
  vega_hits:
    count_events: power_move_event
    starting_count: 0
    count_complete_value: 3
    direction: up
    events_when_complete: finishing_vega
    persist_state: false
    reset_on_complete: false
  vega_zangief_power_hits:
    count_events: s_zangief_active{device.counters.vega_hits.value!=2}
    starting_count: 0
    count_complete_value: 1
    direction: up
    events_when_complete: power_move_event, led_zangief_power_solid
    reset_on_complete: false
  vega_chunli_power_hits:
    count_events: s_chunli_entrance_active{device.counters.vega_hits.value!=2}
    starting_count: 0
    count_complete_value: 1
    direction: up
    events_when_complete: power_move_event, led_chunli_power_solid
    reset_on_complete: false
  vega_balrog_power_hits:
    count_events: s_right_vuk_active{device.counters.vega_hits.value!=2}
    starting_count: 0
    count_complete_value: 1
    direction: up
    events_when_complete: power_move_event, led_balrog_power_solid
    reset_on_complete: false
  vega_final_move_hits:
    count_events: s_left_ramp_rollover_active{device.counters.vega_hits.value==2}
    starting_count: 0
    count_complete_value: 1
    direction: up
    events_when_complete: power_move_event
    reset_on_complete: false
  vega_damage:
    count_events: timer_vega_fight_timer_complete
    starting_count: 0
    count_complete_value: 3
    direction: up
    events_when_complete: vega_losing
