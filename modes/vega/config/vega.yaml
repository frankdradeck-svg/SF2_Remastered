#config_version=6

mode:
  start_events: vega_started
  stop_events: ball_will_end, timer_finishing_vega_timer_complete, timer_vega_losing_timer_complete
  priority: 300

slide_player:
  mode_vega_started: 
    vega:
      action: play
    field:
      action: remove
  timer_vega_intro_timer_complete:
    health_Left_full:
      action: play
      priority: 5
    health_Right_full:
      action: play
      priority: 5
  logicblock_vega_hits_hit{remaining == 0}:
    health_Right_2hit:
      action: remove
      transition:
        type: fade
        duration: 3s
    health_Left_full:
      action: remove
      transition:
        type: fade
        duration: 3s
    health_Left_1hit:
      action: remove
      transition:
        type: fade
        duration: 3s
    health_Left_2hit:
      action: remove
      transition:
        type: fade
        duration: 3s
    vega:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko_loss:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko:
      action: play
      expire: 10s
    fight_hit_3:
      action: play
      expire: 3s
      priority: 5
  vega_losing:
    health_Left_2hit:
      action: remove
      transition:
        type: fade
        duration: 3s
    health_Right_full:
      action: remove
      transition:
        type: fade
        duration: 3s
    health_Right_1hit:
      action: remove
      transition:
        type: fade
        duration: 3s
    health_Right_2hit:
      action: remove
      transition:
        type: fade
        duration: 3s
    vega:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko_loss:
      action: play
      expire: 10s
  timer_vega_fight_timer_complete{device.counters.vega_damage.value==0}:
    health_Left_full:
      action: remove
      transition:
        type: fade
        duration: 3s
    vega:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko_loss:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_1:
      action: play
    health_Left_1hit:
      action: play
      priority: 4
  timer_vega_fight_timer_complete{device.counters.vega_damage.value==1}:
    health_Left_1hit:
      action: remove
      transition:
        type: fade
        duration: 3s
    vega:
