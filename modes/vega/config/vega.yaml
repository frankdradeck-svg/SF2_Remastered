        type: fade
        duration: 5s
    vega_ryu_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ryu_attack_2:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_ko_loss:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_2:
      action: play
    health_Left_2hit:
      action: play
      priority: 3
  power_move_event{device.counters.vega_hits.value==0}:
    health_Right_full:
      action: remove
      transition:
        type: fade
        duration: 3s
    vega:
      action: remove
      transition:
        type: fade
        duration: 5s
    vega_attack_1:
      action: remove
      transition:
        type: fade
        duration: 5s
