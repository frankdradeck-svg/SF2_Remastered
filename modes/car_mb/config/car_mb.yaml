#config_version=6

mode:
  start_events: car_mb_started
  stop_events: ball_will_end, multiball_car_mb_ended
  priority: 300

sound_player:
  mode_car_mb_started:
    car_mb_music:
      bus: music
    bonus_stage_start:
      bus: voice_boost
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==8}:
    car_mb_progress_1:
      bus: voice_boost
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==16}:
    car_mb_progress_2:
      bus: voice_boost
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==24}:
    car_3:
      bus: voice_boost
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==30}:
    car_4:
      bus: voice_boost
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value!=0}:
    car_mb_audio_randomizer:
      bus: voice_loud
    car_mb_damage:
      bus: effects_loud
  s_guile_opto_active{current_player.jackpot_time==1}:
    car_mb_jackpot:
      bus: voice_boost
  spinner_center_spinner_active{current_player.jackpot_time==1}:
    car_mb_jackpot:
      bus: voice_boost
  s_right_orbit_rollover_active{current_player.jackpot_time==1}:
    car_mb_jackpot:
      bus: voice_boost
  s_zangief_active{current_player.jackpot_time==1}:
    car_mb_jackpot:
      bus: voice_boost
  s_left_vuk_active{current_player.jackpot_time==1}:
    car_mb_jackpot:
      bus: voice_boost
  s_right_vuk_active{current_player.jackpot_time==1}:
    car_mb_jackpot:
      bus: voice_boost
  spinner_loop_spinner_active{current_player.jackpot_time==1}:
    car_mb_jackpot:
      bus: voice_boost
    hurry:
      bus: voice_boost
  

slide_player:
  mode_car_mb_started: 
    car_still_dmg0:
      action: play
    field:
      action: remove
    car_mb_intro:
      expire: 3s
  timer_car_intro_timer_complete:
    car_smash_time:
      action: play
      priority: 3
  timer_car_jackpot_timer_complete:
    car_smash_time:
      action: play
      priority: 3
    car_mb_jackpot_time:
      action: remove
  timer_car_smash_timer_complete:
    car_mb_jackpot_time:
      action: play
      priority: 3
    car_smash_time:
      action: remove
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==2}:
    car_still_dmg1:
      action: play
      priority: 1
    car_still_dmg0:
      action: remove
    car_mb_hit_dmg0_to_dmg1:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==4}:
    car_still_dmg2:
      action: play
      priority: 1
    car_still_dmg1:
      action: remove
    car_mb_hit_dmg1_to_dmg2:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==6}:
    car_still_dmg3:
      action: play
      priority: 1
    car_still_dmg2:
      action: remove
    car_mb_hit_dmg2_to_dmg3:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==8}:
    car_mb_hit_dmg3_to_dmg3:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==10}:
    car_still_dmg4:
      action: play
      priority: 1
    car_still_dmg3:
      action: remove
    car_mb_hit_dmg3_to_dmg4:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==12}:
    car_mb_hit_dmg4_to_dmg4:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==14}:
    car_still_dmg5:
      action: play
      priority: 1
    car_still_dmg4:
      action: remove
    car_mb_hit_dmg4_to_dmg5:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==16}:
    car_mb_hit_dmg5_to_dmg5:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==18}:
    car_still_dmg6:
      action: play
      priority: 1
    car_still_dmg5:
      action: remove
    car_mb_hit_dmg5_to_dmg6:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==20}:
    car_mb_hit_dmg6_to_dmg6:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==22}:
    car_still_dmg7:
      action: play
      priority: 1
    car_still_dmg6:
      action: remove
    car_mb_hit_dmg6_to_dmg7:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==24}:
    car_mb_hit_dmg7_to_dmg7:
      expire: 2s
      priority: 2
  logicblock_center_standups_hits_updated{device.counters.center_standups_hits.value==26}:
    car_still_dmg8:
