    number: front-1
    default_pulse_ms: 60ms
    default_hold_power: 0.25
  c_trough_eject:
    number: front-2
    default_pulse_ms: 40ms
    default_hold_power: 0.25
  c_left_sling:
    number: front-5
    default_pulse_ms: 20
  c_right_sling:
    number: front-6
    default_pulse_ms: 20
