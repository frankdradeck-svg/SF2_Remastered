flippers:
  left_flipper:
    main_coil: c_left_flipper
    activation_switch: s_left_flipper
  right_flipper:
    main_coil: c_right_flipper
    activation_switch: s_right_flipper
  upper_flipper:
    main_coil: c_upper_flipper
    activation_switch: s_upper_flipper

diverters:
  left_ramp:
    activation_coil: c_left_ramp_divert
    type: hold
    activate_events: fight_qualified_event, ball_started{current_player.fight_qualified==1}
    enable_events: ball_started
    disable_events: ball_ended, fight1_started, fight2_started
    targets_when_active: playfield
    targets_when_inactive: playfield

  right_ramp:
    activation_coil: c_right_ramp_divert
    type: hold
    activation_time: 10s
    activation_switches: s_right_ramp_divert
    targets_when_active: playfield
    targets_when_inactive: playfield
    enable_events: ball_started
    disable_events: ball_ended


playfields:
  playfield:
    default_source_device: bd_plunger_lane
    tags: default

autofire_coils:
  left_slingshot:
    coil: c_left_sling
    switch: s_left_sling
  right_slingshot:
    coil: c_right_sling
    switch: s_right_sling
  pop_bumper:
    coil: c_pop_bumper
    switch: s_pop_bumper

ball_devices:
  bd_drain:
    ball_switches: s_drain
    eject_coil: c_drain_eject
    eject_targets: bd_trough
    tags: drain
    eject_timeouts: 4s
  bd_trough:
    entrance_switch: s_trough
    entrance_switch_full_timeout: 500ms
    ball_capacity: 3
    eject_coil: c_trough_eject
    eject_coil_enable_time: 300ms
    tags: trough, home
    eject_timeouts: 3s
    eject_targets: bd_plunger_lane
  bd_plunger_lane:
    ball_switches: s_shooter
    mechanical_eject: true
    eject_timeouts: 5s
    eject_coil: c_autolauncher
  bd_left_vuk:
    ball_switches: s_left_vuk
    eject_coil: c_left_vuk
    eject_timeouts: 1s
  bd_right_vuk:
    ball_switches: s_right_vuk
    eject_coil: c_right_vuk
    eject_timeouts: 1s
  
machine:
  balls_installed: 3

  
